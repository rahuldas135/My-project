<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <style>
        body {
            max-width: 400px;
            margin: 40px auto;
            font-family: Arial, sans-serif;
            background-color: #eef3f8;
            color: #17365d;
        }

        h1 {
            border-bottom: 3px solid #17365d;
            padding-bottom: 8px;
        }

        form {
            border: 3px solid #17365d;
            border-radius: 8px;
            padding: 20px;
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(23, 54, 93, 0.2);
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            box-sizing: border-box;
            border: 2px solid #17365d;
            border-radius: 4px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #0b5ed7;
            box-shadow: 0 0 6px rgba(11, 94, 215, 0.5);
        }

        button {
            margin-top: 16px;
            padding: 8px 16px;
            border: 2px solid #17365d;
            border-radius: 4px;
            background-color: #17365d;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        button:hover {
            background-color: #0b5ed7;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <h1>Contact</h1>
    <form>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
